name: "CI: Installers"

# install.sh / install.ps1 and uninstall.sh / uninstall.ps1 (scripts/install),
# the release manifest generator and the macOS .pkg. The installers build from
# the checked-out repository. Nothing here installs onto the runner outside
# temp dirs, except the Linux container smoke, which installs into a throwaway
# container.

on:
  pull_request:
    paths:
      - "scripts/install/**"
      - "apps/cua-spaces/scripts/build-pkg.sh"
      - "apps/cua-spaces/scripts/prepare-cli-sidecar.sh"
      - "apps/cua-spaces/src-tauri/installer/**"
      - "apps/cua-spaces/tests/installer/**"
      - ".github/workflows/ci-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: shellcheck + shfmt + manifest unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/w:ro" koalaman/shellcheck:stable -s sh \
            /w/scripts/install/install.sh /w/scripts/install/uninstall.sh /w/scripts/install/tests/run.sh /w/scripts/install/tests/docker-pester.sh \
            /w/apps/cua-spaces/scripts/build-pkg.sh /w/apps/cua-spaces/scripts/prepare-cli-sidecar.sh \
            /w/apps/cua-spaces/src-tauri/installer/macos-pkg/postinstall /w/apps/cua-spaces/tests/installer/pkg.test.sh
      - name: shfmt
        run: |
          docker run --rm -v "$PWD:/w:ro" mvdan/shfmt:v3 -d \
            /w/scripts/install/install.sh /w/scripts/install/uninstall.sh /w/scripts/install/tests/run.sh \
            /w/apps/cua-spaces/scripts/build-pkg.sh /w/apps/cua-spaces/scripts/prepare-cli-sidecar.sh \
            /w/apps/cua-spaces/src-tauri/installer/macos-pkg/postinstall /w/apps/cua-spaces/tests/installer/pkg.test.sh
      - name: release_manifest.py unit tests
        run: python3 -m unittest discover -s scripts/install/tests -v

  installer-smoke-linux:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: installer smoke (Linux containers)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "alpine:3"]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh test suite (fake checkout and fake cargo)
        run: |
          docker run --rm -v "$PWD/scripts/install:/w:ro" "${{ matrix.image }}" sh -c '
            set -e
            if command -v apk >/dev/null; then apk add -q python3 curl; adduser -D u
            else apt-get update -qq && apt-get install -y -qq python3 curl ca-certificates bsdutils >/dev/null; useradd -m u; fi
            echo "--- as root (dash/ash)"; sh /w/tests/run.sh
            echo "--- as a user"; su u -c "sh /w/tests/run.sh"
          '

  installer-smoke-macos:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: installer smoke (macOS, temp prefix + pkg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: install.sh test suite
        run: sh scripts/install/tests/run.sh
      - name: uninstall.sh tests under macOS's /bin/sh (a throwaway HOME, no real Keychain or services)
        run: python3 -m unittest discover -s scripts/install/tests -p 'test_uninstall.py' -v
      - name: .pkg build + expand + postinstall against a temp volume
        run: sh apps/cua-spaces/tests/installer/pkg.test.sh

  installer-smoke-windows:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: installer smoke (Windows, install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5
          $r = Invoke-Pester scripts/install/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
      - name: install.ps1 -CliOnly builds and installs into a temp prefix
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'prefix'
          ./scripts/install/install.ps1 -CliOnly -Yes -NoOnboarding -NoModifyPath -Prefix $prefix
          if (-not (Test-Path (Join-Path $prefix 'bin/cua.exe'))) { throw 'cua.exe was not installed' }
          if (-not (Test-Path (Join-Path $prefix 'bin/cua-spacesd.exe'))) { throw 'cua-spacesd.exe was not installed' }
      - name: uninstall.ps1 -DryRun changes nothing
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'prefix'
          ./scripts/install/uninstall.ps1 -DryRun -Prefix $prefix
          if (-not (Test-Path (Join-Path $prefix 'bin/cua.exe'))) { throw 'the dry run removed cua.exe' }
