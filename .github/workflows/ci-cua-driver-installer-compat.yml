name: "CI: Cua Driver installer compatibility"

# The installers build from the checkout now, so this certifies that the
# current install.sh / install.ps1 build and install a working driver on each
# supported OS. Nothing is downloaded from a release.

on:
  workflow_call:
    inputs:
      versions:
        description: "Ignored: the installers build from the checkout"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      versions:
        description: "Ignored: the installers build from the checkout"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

# No concurrency group. In a reusable call the group would belong to the
# caller's run, and "CI: Release metadata" starts several runs for one pull
# request at once (opened, labeled, edited, synchronize). Cancelling the older
# ones made each superseded run's `validate` see `cancelled` and fail, and that
# failed `validate` check on the head commit blocked the merge even after the
# newest run passed. Every run now finishes. For most pull requests the scope
# job skips the installer matrix, so duplicates cost little.

jobs:
  scope:
    name: Resolve installer scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - name: Decide whether installer certification is affected
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SHOULD_RUN=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            CHANGED_FILES=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename')
            if ! grep -Eq \
              '^(libs/cua-driver/(scripts/(install|install-local|_install-rust|_install-local-rust|_install-common)\.(sh|ps1|psm1)|rust/)|\.github/workflows/(cd-rust-cua-driver|ci-cua-driver-installer-compat)\.yml)' \
              <<< "$CHANGED_FILES"; then
              SHOULD_RUN=false
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  install:
    name: "${{ matrix.os }} installer"
    needs: scope
    if: needs.scope.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CUA_DRIVER_RS_KEEP_VERSIONS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxtst6 libxext6 libwayland-client0 libxkbcommon0

      - name: Build and install with the current macOS/Linux installer
        if: runner.os != 'Windows'
        env:
          CUA_DRIVER_LOCAL_HOME: ${{ runner.temp }}/cua-driver-home
          CUA_DRIVER_LOCAL_INSTALL_DIR: ${{ runner.temp }}/cua-driver-bin
        run: |
          bash libs/cua-driver/scripts/install.sh
          INSTALLED="$CUA_DRIVER_LOCAL_INSTALL_DIR/cua-driver-local"
          test -x "$INSTALLED"
          "$INSTALLED" --version

      - name: Build and install with the current Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUA_DRIVER_LOCAL_HOME: ${{ runner.temp }}/cua-driver-home
          CUA_DRIVER_LOCAL_INSTALL_DIR: ${{ runner.temp }}/cua-driver-bin
        run: |
          & ./libs/cua-driver/scripts/install.ps1 -NoAutoStart -NoPathUpdate
          $binary = Join-Path $env:CUA_DRIVER_LOCAL_INSTALL_DIR "cua-driver-local.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "installer did not create $binary"
          }
          & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "installed binary exited with $LASTEXITCODE"
          }

  installer-compatibility:
    name: Installer compatibility summary
    needs: [scope, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report result
        run: |
          echo "scope:   ${{ needs.scope.result }}"
          echo "install: ${{ needs.install.result }}"
          echo "selected: ${{ needs.scope.outputs.should_run }}"
          if [[ "${{ needs.scope.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.scope.outputs.should_run }}" == "true" &&
                "${{ needs.install.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.scope.outputs.should_run }}" != "true" ]]; then
            echo "Installer certification is unaffected by this pull request."
          fi
