[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "cua-core"
version = "0.3.2"
description = "Core functionality and shared utilities for Cua"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "TryCua", email = "gh@trycua.com" }
]
dependencies = []
requires-python = ">=3.11,<3.14"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["cua_core/"]
source-includes = ["tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]